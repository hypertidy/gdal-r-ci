# Build and push Docker image chains to GHCR.
#
# Two variants are built from this one workflow:
#   release  — latest stable GDAL/PROJ/GEOS release tarballs (weekly)
#   dev      — HEAD of OSGeo/gdal + PROJ/GEOS main branches (daily canary)
#
# Layer chain for each variant:
#   gdal-system  →  gdal-r  →  gdal-r-full
#
# Tags produced:
#   ghcr.io/hypertidy/gdal-system:latest    (release)
#   ghcr.io/hypertidy/gdal-system:dev
#   ghcr.io/hypertidy/gdal-r:latest
#   ghcr.io/hypertidy/gdal-r:dev
#   ghcr.io/hypertidy/gdal-r-full:latest
#   ghcr.io/hypertidy/gdal-r-full:dev
#
# The :dev chain is the canary — daily failures here are the early warning.
# The :latest chain is what consumer packages use for stable CI.
#
# Version pins for release builds — update these when new releases ship:
#   GDAL  3.10.2   https://github.com/OSGeo/gdal/releases
#   PROJ  9.5.1    https://github.com/OSGeo/PROJ/releases
#   GEOS  3.13.1   https://github.com/libgeos/geos/releases

name: Build images

on:
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - 'build-scripts/**'
      - 'config/**'
      - 'scripts/**'
      - '.github/workflows/build-images.yml'
  schedule:
    # Release chain: weekly Monday 02:00 UTC
    - cron: '0 2 * * 1'
    # Dev/canary chain: daily 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      variant:
        description: 'Which variant to build'
        required: false
        default: 'both'
        type: choice
        options: [both, release, dev]
      no_cache:
        description: 'Disable Docker layer cache (force full rebuild)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  ORG: hypertidy

jobs:
  # ── Decide which variants to build ──────────────────────────────────────────
  setup:
    runs-on: ubuntu-latest
    outputs:
      variants: ${{ steps.set.outputs.variants }}
    steps:
      - id: set
        run: |
          EVENT="${{ github.event_name }}"
          SCHED_HOUR=$(date -u +%H)
          INPUT="${{ inputs.variant }}"

          if [ "$EVENT" = "workflow_dispatch" ]; then
            VARIANT="$INPUT"
          elif [ "$EVENT" = "schedule" ]; then
            # 02:xx = release (Monday only), 03:xx = dev (daily)
            if [ "$SCHED_HOUR" = "02" ]; then VARIANT="release"; else VARIANT="dev"; fi
          else
            # push to main — build both
            VARIANT="both"
          fi

          if [ "$VARIANT" = "both" ]; then
            echo 'variants=["release","dev"]' >> "$GITHUB_OUTPUT"
          else
            echo "variants=[\"$VARIANT\"]" >> "$GITHUB_OUTPUT"
          fi

  # ── gdal-system ─────────────────────────────────────────────────────────────
  build-system:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJson(needs.setup.outputs.variants) }}
        include:
          - variant: release
            tag_suffix: latest
          - variant: dev
            gdal_version: master
            proj_version: master
            geos_version: main
            tag_suffix: dev

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Resolve release versions
        if: matrix.variant == 'release'
        id: versions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          eval "$(bash build-scripts/get-versions.sh)"
          echo "gdal_version=${GDAL_VERSION}" >> "$GITHUB_OUTPUT"
          echo "proj_version=${PROJ_VERSION}" >> "$GITHUB_OUTPUT"
          echo "geos_version=${GEOS_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved: GDAL=${GDAL_VERSION} PROJ=${PROJ_VERSION} GEOS=${GEOS_VERSION}"

      - name: Set dev versions
        if: matrix.variant == 'dev'
        id: versions-dev
        run: |
          echo "gdal_version=master"  >> "$GITHUB_OUTPUT"
          echo "proj_version=master"  >> "$GITHUB_OUTPUT"
          echo "geos_version=main"    >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.gdal-system
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.ORG }}/gdal-system:${{ matrix.tag_suffix }}
          build-args: |
            GDAL_VERSION=${{ steps.versions.outputs.gdal_version || steps.versions-dev.outputs.gdal_version }}
            PROJ_VERSION=${{ steps.versions.outputs.proj_version || steps.versions-dev.outputs.proj_version }}
            GEOS_VERSION=${{ steps.versions.outputs.geos_version || steps.versions-dev.outputs.geos_version }}
            KEA_VERSION=1.5.3
            CACHE_DATE=${{ github.run_id }}
          no-cache: ${{ inputs.no_cache == 'true' }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.ORG }}/gdal-system:${{ matrix.tag_suffix }}
          cache-to: type=inline

  # ── gdal-r ───────────────────────────────────────────────────────────────────
  build-r:
    needs: [setup, build-system]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJson(needs.setup.outputs.variants) }}
        include:
          - variant: release
            tag_suffix: latest
          - variant: dev
            tag_suffix: dev

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.gdal-r
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.ORG }}/gdal-r:${{ matrix.tag_suffix }}
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ env.ORG }}/gdal-system:${{ matrix.tag_suffix }}
          no-cache: ${{ inputs.no_cache == 'true' }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.ORG }}/gdal-r:${{ matrix.tag_suffix }}
          cache-to: type=inline

  # ── gdal-r-full ──────────────────────────────────────────────────────────────
  build-full:
    needs: [setup, build-r]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJson(needs.setup.outputs.variants) }}
        include:
          - variant: release
            tag_suffix: latest
          - variant: dev
            tag_suffix: dev

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.gdal-r-full
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.ORG }}/gdal-r-full:${{ matrix.tag_suffix }}
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ env.ORG }}/gdal-r:${{ matrix.tag_suffix }}
          no-cache: ${{ inputs.no_cache == 'true' }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.ORG }}/gdal-r-full:${{ matrix.tag_suffix }}
          cache-to: type=inline


  # ── gdal-python ──────────────────────────────────────────────────────────────
  build-python:
    needs: [setup, build-full]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJson(needs.setup.outputs.variants) }}
        include:
          - variant: release
            tag_suffix: latest
          - variant: dev
            tag_suffix: dev

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.gdal-python
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.ORG }}/gdal-python:${{ matrix.tag_suffix }}
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ env.ORG }}/gdal-r-full:${{ matrix.tag_suffix }}
          no-cache: ${{ inputs.no_cache == 'true' }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.ORG }}/gdal-python:${{ matrix.tag_suffix }}
          cache-to: type=inline
