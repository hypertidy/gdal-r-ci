# Build and push ghcr.io/hypertidy/gdal-python
#
# Triggered by repository_dispatch from build-gdal-r-full when gdal-r-full
# digest changes. Also triggerable manually.
# Adds uv venv + Python geo stack on top of gdal-r-full.

name: Build gdal-python

on:
  repository_dispatch:
    types: [gdal-r-full-updated]
schedule:
   - cron: '0 4 * * 1'   # release: weekly Monday
   - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      variant:
        description: 'Which variant to build'
        required: false
        default: 'release'
        type: choice
        options: [release, dev]
      no_cache:
        description: 'Disable Docker layer cache'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

concurrency:
  group: ${{ github.workflow }}-${{ github.event.client_payload.variant || inputs.variant || 'release' }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  ORG: hypertidy

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Resolve vars
        id: vars
        run: |
          VARIANT="${{ github.event.client_payload.variant || inputs.variant || 'release' }}"
          TAG="${{ github.event.client_payload.tag_suffix }}"
          NO_CACHE="${{ github.event.client_payload.no_cache || inputs.no_cache || 'false' }}"
          [ -z "$TAG" ] && TAG=$([ "$VARIANT" = "dev" ] && echo "dev" || echo "latest")
          echo "variant=${VARIANT}"   >> "$GITHUB_OUTPUT"
          echo "tag_suffix=${TAG}"    >> "$GITHUB_OUTPUT"
          echo "no_cache=${NO_CACHE}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.gdal-python
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.ORG }}/gdal-python:${{ steps.vars.outputs.tag_suffix }}
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ env.ORG }}/gdal-r-full:${{ steps.vars.outputs.tag_suffix }}
          no-cache: ${{ steps.vars.outputs.no_cache == 'true' }}
          cache-from: type=gha,scope=gdal-python-${{ steps.vars.outputs.tag_suffix }}
          cache-to: type=gha,mode=max,scope=gdal-python-${{ steps.vars.outputs.tag_suffix }}

      - name: Summary
        run: |
          {
            echo "## gdal-python:${{ steps.vars.outputs.tag_suffix }} built"
            echo "Base: gdal-r-full:${{ steps.vars.outputs.tag_suffix }}"
            echo "Variant: ${{ steps.vars.outputs.variant }}"
          } >> "$GITHUB_STEP_SUMMARY"
