# Build and publish conda-gdal-python Docker image
# GDAL + Python via conda-forge on Ubuntu base

name: Build conda-gdal-python image

on:
  push:
    branches: [main]
    paths:
      - 'docker/conda-gdal-python/**'
      - '.github/workflows/build-conda-gdal-python.yml'
  workflow_dispatch:
    inputs:
      gdal_version:
        description: 'GDAL version (blank for latest)'
        required: false
        default: ''
        type: string
      python_version:
        description: 'Python version'
        required: false
        default: '3.12'
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: hypertidy/conda-gdal-python

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine versions and tags
        id: versions
        run: |
          PYTHON_VERSION="${{ inputs.python_version || '3.12' }}"
          GDAL_VERSION="${{ inputs.gdal_version }}"
          
          if [ -z "$GDAL_VERSION" ]; then
            # Latest GDAL - tag as 'latest' and with date
            DATE_TAG=$(date +%Y%m%d)
            TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
            TAGS="${TAGS},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${DATE_TAG}"
            GDAL_SPEC="gdal"
          else
            # Specific version
            TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:gdal-${GDAL_VERSION}"
            TAGS="${TAGS},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:gdal-${GDAL_VERSION}-py${PYTHON_VERSION}"
            GDAL_SPEC="gdal=${GDAL_VERSION}"
          fi
          
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "gdal_spec=${GDAL_SPEC}" >> $GITHUB_OUTPUT
          echo "python_version=${PYTHON_VERSION}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/conda-gdal-python/Dockerfile
          push: true
          tags: ${{ steps.versions.outputs.tags }}
          build-args: |
            GDAL_SPEC=${{ steps.versions.outputs.gdal_spec }}
            PYTHON_VERSION=${{ steps.versions.outputs.python_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test image
        run: |
          docker run --rm ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest bash -c '
            echo "=== GDAL ===" && gdalinfo --version
            echo "=== Python ===" && python --version
            echo "=== GDAL Python binding ===" && python -c "from osgeo import gdal; print(gdal.__version__)"
            echo "=== PROJ ===" && proj 2>&1 | head -1
            echo "=== Conda packages ===" && conda list | grep -E "^(gdal|proj|python) "
          '

      - name: Summary
        run: |
          echo "## conda-gdal-python image built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.versions.outputs.tags }}" | tr ',' '\n' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Pull:**" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
