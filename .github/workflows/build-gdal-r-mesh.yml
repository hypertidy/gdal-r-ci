# Build and push ghcr.io/hypertidy/gdal-r-mesh
#
# Triggered by repository_dispatch from build-gdal-r-full (release variant
# only: the image is :latest only), manually, and on pull requests that
# touch its files (build and smoke test, no push).
#
# Adds the mesh stack on top of gdal-r-full: wk with simple features
# surface types, wkpool, cdtr, laridae, decido (config/r-packages-mesh.txt).

name: Build gdal-r-mesh

on:
  repository_dispatch:
    types: [gdal-r-full-updated]
  workflow_dispatch:
    inputs:
      no_cache:
        description: 'Disable Docker layer cache'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
  pull_request:
    paths:
      - 'docker/Dockerfile.gdal-r-mesh'
      - 'config/r-packages-mesh.txt'
      - 'scripts/install-mesh.R'
      - 'scripts/smoke-mesh.R'
      - '.github/workflows/build-gdal-r-mesh.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  ORG: hypertidy

jobs:
  build:
    # gdal-r-full dispatches for both variants; only follow the release one
    if: github.event_name != 'repository_dispatch' || github.event.client_payload.variant != 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Resolve vars
        id: vars
        run: |
          NO_CACHE="${{ github.event.client_payload.no_cache || inputs.no_cache || 'false' }}"
          echo "no_cache=${NO_CACHE}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.gdal-r-mesh
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.ORG }}/gdal-r-mesh:latest
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ env.ORG }}/gdal-r-full:latest
          secrets: |
            github_pat=${{ secrets.GITHUB_TOKEN }}
          no-cache: ${{ steps.vars.outputs.no_cache == 'true' }}
          cache-from: type=gha,scope=gdal-r-mesh-latest
          cache-to: type=gha,mode=max,scope=gdal-r-mesh-latest

      - name: Summary
        run: |
          {
            echo "## gdal-r-mesh:latest built"
            echo "Base: gdal-r-full:latest"
            echo "Pushed: ${{ github.event_name != 'pull_request' }}"
            echo ""
            echo '```'
            grep -v '^#' config/r-packages-mesh.txt | sed '/^$/d'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
