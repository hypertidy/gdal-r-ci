# Build and push ghcr.io/hypertidy/gdal-r-python-extras
#
# Triggered by repository_dispatch from build-gdal-r-python on release-variant
# builds. Also triggerable manually.
#
# Adds the R kitchen sink (hypertidy stack, arrow, targets, dev tooling) on
# top of gdal-r-python via scripts/install-extras.R.
#
# No longer the leaf of the chain — on a successful build this workflow
# dispatches gdal-r-python-extras-updated to trigger gdal-r-python-extras-rust.
# Only :latest, no :dev variant. For bleeding-edge work, base directly on
# gdal-r-python:dev and overlay packages via a writable R_LIBS_USER mount.

name: Build gdal-r-python-extras

on:
  repository_dispatch:
    types: [gdal-r-python-updated]
  workflow_dispatch:
    inputs:
      no_cache:
        description: 'Disable Docker layer cache'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  ORG: hypertidy

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Resolve vars
        id: vars
        run: |
          # Always :latest — extras has no :dev. If a dispatch payload arrives
          # with a different tag (e.g. someone wired this up wrong), force latest.
          TAG="latest"
          NO_CACHE="${{ github.event.client_payload.no_cache || inputs.no_cache || 'false' }}"
          echo "tag_suffix=${TAG}"  >> "$GITHUB_OUTPUT"
          echo "no_cache=${NO_CACHE}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.gdal-r-python-extras
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.ORG }}/gdal-r-python-extras:${{ steps.vars.outputs.tag_suffix }}
          secrets: |
            gh_pat=${{ secrets.GITHUB_TOKEN }}
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ env.ORG }}/gdal-r-python:${{ steps.vars.outputs.tag_suffix }}
          no-cache: ${{ steps.vars.outputs.no_cache == 'true' }}
          cache-from: type=gha,scope=gdal-r-python-extras-${{ steps.vars.outputs.tag_suffix }}
          cache-to: type=gha,mode=max,scope=gdal-r-python-extras-${{ steps.vars.outputs.tag_suffix }}

      - name: Summary
        run: |
          {
            echo "## gdal-r-python-extras:${{ steps.vars.outputs.tag_suffix }} built"
            echo "Base: gdal-r-python:${{ steps.vars.outputs.tag_suffix }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch extras-rust build
        uses: peter-evans/repository-dispatch@v4.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: gdal-r-python-extras-updated
          client-payload: '{"no_cache": "${{ steps.vars.outputs.no_cache }}"}'
