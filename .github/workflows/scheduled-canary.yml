# Scheduled canary: test core R geospatial packages against release and dev GDAL.
#
# Runs fortnightly (1st and 15th) and on workflow_dispatch.
# Uses pre-built images so no compilation of GDAL itself — just the R packages.
#
# Matrix: {gdalraster, sf, terra, vapour, gdalcubes}
#       × {cran, github}
#       × {latest, dev}
#
# Source axis tells different stories per cell:
#   cran    — what users actually have installed
#   github  — what maintainers are pushing toward
# Diverging results across the source axis indicate the package's CRAN release
# is out of step with its development repo.
#
# Variant axis:
#   latest  — released GDAL — failure here is urgent
#   dev     — GDAL master — failure here is canary, file upstream
#
# Each cell writes a small status file. The summary job aggregates these into
# a per-cell pass/fail grid in the issue body, so triage is one glance.

name: Scheduled canary check

on:
  schedule:
    - cron: '0 4 1,15 * *'
  workflow_dispatch:
    inputs:
      packages:
        description: 'Packages to test (comma-separated or "all")'
        required: false
        default: 'all'
        type: string
      sources:
        description: 'Sources to test'
        required: false
        default: 'both'
        type: choice
        options: [both, cran, github]
      gdal-variants:
        description: 'Image variants to test against'
        required: false
        default: 'both'
        type: choice
        options: [both, latest, dev]

env:
  ALL_PACKAGES: 'gdalraster,sf,terra,vapour,gdalcubes'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.set.outputs.packages }}
      sources:  ${{ steps.set.outputs.sources }}
      variants: ${{ steps.set.outputs.variants }}
    steps:
      - id: set
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             && [ "${{ inputs.packages }}" != "all" ]; then
            PKGS="${{ inputs.packages }}"
          else
            PKGS="${{ env.ALL_PACKAGES }}"
          fi
          echo "packages=$(echo "$PKGS" | tr ',' '\n' | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

          SSEL="${{ inputs.sources }}"
          if [ "$SSEL" = "cran" ]; then
            echo 'sources=["cran"]' >> "$GITHUB_OUTPUT"
          elif [ "$SSEL" = "github" ]; then
            echo 'sources=["github"]' >> "$GITHUB_OUTPUT"
          else
            echo 'sources=["cran","github"]' >> "$GITHUB_OUTPUT"
          fi

          VSEL="${{ inputs.gdal-variants }}"
          if [ "$VSEL" = "latest" ]; then
            echo 'variants=["latest"]' >> "$GITHUB_OUTPUT"
          elif [ "$VSEL" = "dev" ]; then
            echo 'variants=["dev"]' >> "$GITHUB_OUTPUT"
          else
            echo 'variants=["latest","dev"]' >> "$GITHUB_OUTPUT"
          fi

  check:
    name: ${{ matrix.package }} (${{ matrix.source }}) / gdal-r-full:${{ matrix.gdal-variant }}
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/hypertidy/gdal-r-full:${{ matrix.gdal-variant }}
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.setup.outputs.packages) }}
        source:  ${{ fromJson(needs.setup.outputs.sources) }}
        gdal-variant: ${{ fromJson(needs.setup.outputs.variants) }}

    steps:
      - name: Print environment
        run: |
          echo "=== ${{ matrix.package }} (${{ matrix.source }}) against gdal-r-full:${{ matrix.gdal-variant }} ==="
          gdal-config --version
          echo "PROJ: $(pkg-config --modversion proj)"
          echo "GEOS: $(geos-config --version)"
          R --version | head -1

      - name: Fetch package source
        id: fetch
        run: |
          set -e
          PKG="${{ matrix.package }}"
          SRC="${{ matrix.source }}"

          if [ "$SRC" = "cran" ]; then
            mkdir -p _dl
            Rscript -e "
              download.packages('$PKG', destdir = '_dl',
                                type = 'source',
                                repos = 'https://cloud.r-project.org')
            "
            tarball=$(ls _dl/*.tar.gz | head -1)
            [ -n "$tarball" ] || { echo "No tarball downloaded"; exit 1; }
            tar -xzf "$tarball" -C _dl
            extracted_dir=$(find _dl -maxdepth 1 -type d -name "$PKG*" | head -1)
            [ -d "$extracted_dir" ] || { echo "Could not find extracted directory"; ls -la _dl; exit 1; }
            mv "$extracted_dir" pkg
            rm -rf _dl

          elif [ "$SRC" = "github" ]; then
            case "$PKG" in
              gdalraster) repo="https://github.com/firelab/gdalraster.git" ;;
              sf)         repo="https://github.com/r-spatial/sf.git" ;;
              terra)      repo="https://github.com/rspatial/terra.git" ;;
              vapour)     repo="https://github.com/hypertidy/vapour.git" ;;
              gdalcubes)  repo="https://github.com/appelmar/gdalcubes.git" ;;
              *) echo "Unknown package: $PKG"; exit 1 ;;
            esac

            if [ "$PKG" = "gdalcubes" ]; then
              git clone --depth 1 "$repo" _gh
              if [ -d _gh/R-package ]; then
                cp -r _gh/R-package pkg
              else
                cp -r _gh pkg
              fi
              rm -rf _gh
            else
              git clone --depth 1 "$repo" pkg
            fi

          else
            echo "Unknown source: $SRC"; exit 1
          fi

          echo "=== pkg/ contents ==="
          ls -la pkg/ | head -20
          if [ ! -f pkg/DESCRIPTION ]; then
            echo "ERROR: pkg/DESCRIPTION not found after fetch"
            exit 1
          fi

      - name: Install R dependencies
        working-directory: pkg
        run: |
          Rscript -e "
            remotes::install_deps(
              dependencies = c('Depends', 'Imports', 'LinkingTo'),
              upgrade = 'never',
              type = 'source'
            )
          "

      - name: Build
        working-directory: pkg
        run: R CMD build --no-build-vignettes .

      - name: Check
        id: rcheck
        working-directory: pkg
        env:
          _R_CHECK_FORCE_SUGGESTS_: 'false'
        run: |
          tarball=$(ls -1 *.tar.gz | head -1)
          R CMD check --no-manual --ignore-vignettes "$tarball"

      - name: Show logs on failure
        if: failure()
        working-directory: pkg
        run: |
          echo "=== pkg/ contents ==="
          ls -la
          echo ""
          for f in *.Rcheck/00check.log *.Rcheck/00install.out *.Rcheck/00build.out; do
            [ -f "$f" ] && echo "=== $f ===" && cat "$f"
          done
          echo ""
          for f in *.Rcheck/tests/*.Rout *.Rcheck/tests/*.Rout.fail; do
            [ -f "$f" ] && echo "=== $f ===" && cat "$f"
          done

      - name: Record cell result
        if: always()
        # Writes a tiny status file the summary job will collect. The filename
        # encodes the cell coordinates; the contents are a single status word
        # plus optionally a one-line reason scraped from check output.
        run: |
          mkdir -p /tmp/canary-status
          CELL="${{ matrix.package }}__${{ matrix.source }}__${{ matrix.gdal-variant }}"
          STATUS="${{ job.status }}"

          # Try to extract a one-line summary of why the check failed, if it did.
          REASON=""
          if [ "$STATUS" != "success" ]; then
            CHECK_LOG=$(ls pkg/*.Rcheck/00check.log 2>/dev/null | head -1)
            if [ -f "$CHECK_LOG" ]; then
              # Last "ERROR" or "WARNING" line is usually the operative diagnostic.
              REASON=$(grep -E '^\* checking .* (ERROR|WARNING)$' "$CHECK_LOG" | tail -1 | sed 's/^\* checking //' | sed 's/ \.\.\./:/')
            fi
            if [ -z "$REASON" ]; then
              # Fall back to install.out for build failures
              INSTALL_LOG=$(ls pkg/*.Rcheck/00install.out 2>/dev/null | head -1)
              if [ -f "$INSTALL_LOG" ]; then
                REASON=$(grep -E '(^ERROR:|^configure: error:|cannot find|undefined)' "$INSTALL_LOG" | head -1 | cut -c1-120)
              fi
            fi
            if [ -z "$REASON" ]; then REASON="(see job log)"; fi
          fi

          # Format: STATUS|REASON (single line)
          echo "${STATUS}|${REASON}" > "/tmp/canary-status/${CELL}.txt"
          cat "/tmp/canary-status/${CELL}.txt"

      - name: Upload cell status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: status-${{ matrix.package }}-${{ matrix.source }}-${{ matrix.gdal-variant }}
          path: /tmp/canary-status/
          retention-days: 30

      - name: Upload full check directory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}-${{ matrix.source }}-${{ matrix.gdal-variant }}-${{ github.run_id }}
          path: pkg/*.Rcheck
          retention-days: 30

  summary:
    name: Summary
    needs: [setup, check]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download all cell statuses
        uses: actions/download-artifact@v4
        with:
          pattern: status-*
          path: status/
          merge-multiple: true

      - name: Build summary table
        id: table
        run: |
          # Build a markdown table: rows = packages, columns = source × variant.
          # Read each status file and slot into the grid.

          PACKAGES='${{ needs.setup.outputs.packages }}'
          SOURCES='${{ needs.setup.outputs.sources }}'
          VARIANTS='${{ needs.setup.outputs.variants }}'

          # Header
          HEADER="| package |"
          SEP="|---|"
          for src in $(echo "$SOURCES" | jq -r '.[]'); do
            for var in $(echo "$VARIANTS" | jq -r '.[]'); do
              HEADER="$HEADER ${src}/${var} |"
              SEP="${SEP}---|"
            done
          done

          {
            echo "$HEADER"
            echo "$SEP"
            for pkg in $(echo "$PACKAGES" | jq -r '.[]'); do
              ROW="| ${pkg} |"
              for src in $(echo "$SOURCES" | jq -r '.[]'); do
                for var in $(echo "$VARIANTS" | jq -r '.[]'); do
                  CELL_FILE="status/${pkg}__${src}__${var}.txt"
                  if [ -f "$CELL_FILE" ]; then
                    STATUS=$(cut -d'|' -f1 "$CELL_FILE")
                    REASON=$(cut -d'|' -f2- "$CELL_FILE")
                    case "$STATUS" in
                      success) MARK="✓" ;;
                      failure) MARK="✗ $REASON" ;;
                      cancelled) MARK="⊘ cancelled" ;;
                      *) MARK="? $STATUS" ;;
                    esac
                  else
                    MARK="—"
                  fi
                  ROW="$ROW $MARK |"
                done
              done
              echo "$ROW"
            done
          } > summary-table.md

          echo "=== Summary table ==="
          cat summary-table.md

          # Also write to GitHub step summary
          echo "## Canary check — $(date -u '+%Y-%m-%d')" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          cat summary-table.md >> "$GITHUB_STEP_SUMMARY"

          # Compute whether anything failed (drives the issue-creation step)
          ANY_FAIL=$(grep -l '^failure' status/*.txt 2>/dev/null | wc -l)
          echo "any_failure=$ANY_FAIL" >> "$GITHUB_OUTPUT"

      - name: Open issue on failure
        if: steps.table.outputs.any_failure != '0' && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const table = fs.readFileSync('summary-table.md', 'utf8');
            const date = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `Canary check failed — ${date}`,
              body: [
                'The scheduled canary check detected failures.',
                '',
                '### Per-cell results',
                '',
                table,
                '',
                `Workflow run: ${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
                '',
                '### Diagnostic patterns',
                '',
                '- Same cell red on both sources → bug exists in CRAN release and GitHub HEAD (real bug).',
                '- Red on github only, green on cran → GitHub HEAD has a regression CRAN doesn\'t (or HEAD is stale relative to CRAN).',
                '- Red on cran only, green on github → CRAN release lags behind a fix already on GitHub.',
                '- Red on :dev only → upstream GDAL API change. File issue against the package, not us.',
                '- Red on :latest → released-GDAL regression. Urgent.',
              ].join('\n'),
              labels: ['canary', 'automated'],
            });
